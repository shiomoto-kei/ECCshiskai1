<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>安否確認</title>
<link rel="stylesheet" href="./css/chosescreen.css">
</head>

<body>

<div class="form-box">

    <div class="top-bar">
        <!--メニューボタン-->
        <button class="menu-btn">☰</button>
        <!--ログアウトボタン-->
        <button class="logout-btn" onclick="location.href='/loginscreen.html'">
        logout
        </button>
    </div>

    <h1>株式会社の安否確認</h1>
    <!--被害があった場合押すボタン-->
    <label class="radio-box">
        <input type="radio" name="safe">
        YES
    </label>
    <!-- メモ帳 -->
    <textarea class="memo"
    placeholder="詳細内容を入力してください"></textarea>


    <!--被害がなかった場合押すボタン-->
    <label class="radio-box">
        <input type="radio" name="safe">
        NO
    </label>



    <!--メモ帳-->
    <textarea class="memo"
    placeholder="詳細内容を入力してください"></textarea>

    <button type="submit">送信</button>

</div>

</body>
</html>
