<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安否確認</title>
<link rel="stylesheet" href="./css/chosescreen.css">
</head>
<body>
<div class="form-box">

    <div class="top-bar">
        <button class="menu-btn">☰</button>

        <button class="logout-btn"
            onclick="location.href='/loginscreen.html'">
            Logout
        </button>
    </div>

    <h1>安否確認</h1>

<form action="staff.html" method="get" class="form-get"></form>
    <p class="question">
        被害に遭われましたか？
    </p>

    <label class="radio-box">
        <input type="radio" name="status">
        Yes
    </label>


    <label class="text-box">
        <textarea
            name="text"
            placeholder="詳細な内容を記入してください"></textarea>
    </label>

    <label class="radio-box">
        <input type="radio" name="status">
        No
    </label>


    <label class="text-box">
        <textarea
            name="text"
            placeholder="詳細な内容を記入してください"></textarea>
    </label>

    <button type="submit">送信</button>
</form>
</div>
</body>
</html>
