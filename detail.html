<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>詳細</title>
    <link rel="stylesheet" href="./css/detail.css">
</head>

<body>
    <header>
        <h1>詳細(Admin)</h1>
    </header>
    <div class="container">
        <div class="image">
            <img src="image/person1-15.png" width="260" height="320" alt="person">
        </div>
        <form class="detail">
            <div>
                <label for="name">名前:</label>
                <input type="text" name="name" placeholder="名前">
                <button>編集</button>
            </div>
            <div>
                <label for="id">ID:</label>
                <input type="text" name="id" placeholder="">
                <button>編集</button>
            </div>
            <div>
                <label for="position"> 役職: </label>
                <input type="text" name="position" placeholder="">
                <button>編集</button>
            </div>
            <div>
                <label for="damage">被害状況:</label>
                <input type="text" name="damage" placeholder="">
                <button>編集</button>
            </div>

            
            <div class="comment">
                <textarea name="comment" style="width: 100%;" rows="12" placeholder="ご自由にご記入ください"></textarea>
            </div>
        </form>
    </div>
</body>
</html>
